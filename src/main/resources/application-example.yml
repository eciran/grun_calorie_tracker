spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: grun-calorie-tracker
  messages:
    # Use the requested TR/EN locale, never the server operating-system language.
    fallback-to-system-locale: false
    encoding: UTF-8
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grun_calorie_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:7MB}
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
    cache-names: foodProductById,foodProductByBarcode,foodProductSearch,dashboardDailySummary,progressBasicAnalytics,progressAdvancedAnalytics,energyBalanceAnalytics,micronutrientAnalytics
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:1s}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: GRun Calorie Tracker API
    version: 0.0.1-SNAPSHOT

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"

jwt:
  # Base64 encoded secret key with sufficient length for HS256
  secret: ${JWT_SECRET:Q0hBTkdFX01FX0xPQ0FMX0RFVkVMT1BNRU5UX1NFQ1JFVF9LRVlfMTIzNDU2Nzg5MA==}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

openfoodfacts:
  base-url: ${OPENFOODFACTS_BASE_URL:https://world.openfoodfacts.org}

grun:
  product-cache:
    enabled: ${GRUN_PRODUCT_CACHE_ENABLED:true}
    negative-ttl: ${GRUN_PRODUCT_CACHE_NEGATIVE_TTL:5s}
    coalescing:
      enabled: ${GRUN_PRODUCT_CACHE_COALESCING_ENABLED:true}
      max-concurrent-loads: ${GRUN_PRODUCT_CACHE_COALESCING_MAX_CONCURRENT_LOADS:128}
      wait-timeout: ${GRUN_PRODUCT_CACHE_COALESCING_WAIT_TIMEOUT:1s}
    max-payload-budget-bytes: ${GRUN_PRODUCT_CACHE_MAX_PAYLOAD_BUDGET_BYTES:67108864}
    search:
      ttl: ${GRUN_PRODUCT_CACHE_SEARCH_TTL:30s}
      max-entries: ${GRUN_PRODUCT_CACHE_SEARCH_MAX_ENTRIES:256}
      max-value-bytes: ${GRUN_PRODUCT_CACHE_SEARCH_MAX_VALUE_BYTES:65536}
    detail:
      ttl: ${GRUN_PRODUCT_CACHE_DETAIL_TTL:5m}
      max-entries: ${GRUN_PRODUCT_CACHE_DETAIL_MAX_ENTRIES:512}
      max-value-bytes: ${GRUN_PRODUCT_CACHE_DETAIL_MAX_VALUE_BYTES:16384}
  product-catalog:
    audit:
      enabled: ${GRUN_PRODUCT_CATALOG_AUDIT_ENABLED:false}
      batch-size: ${GRUN_PRODUCT_CATALOG_AUDIT_BATCH_SIZE:250}
      time-budget: ${GRUN_PRODUCT_CATALOG_AUDIT_TIME_BUDGET:15s}
      lease: ${GRUN_PRODUCT_CATALOG_AUDIT_LEASE:2m}
      max-attempts: ${GRUN_PRODUCT_CATALOG_AUDIT_MAX_ATTEMPTS:3}
      retry-delay: ${GRUN_PRODUCT_CATALOG_AUDIT_RETRY_DELAY:2m}
      repeat-interval: ${GRUN_PRODUCT_CATALOG_AUDIT_REPEAT_INTERVAL:24h}
      tick-ms: ${GRUN_PRODUCT_CATALOG_AUDIT_TICK_MS:60000}
      zone: ${GRUN_PRODUCT_CATALOG_AUDIT_ZONE:Europe/Dublin}
      downtime-start: ${GRUN_PRODUCT_CATALOG_AUDIT_DOWNTIME_START:01:30}
      downtime-end: ${GRUN_PRODUCT_CATALOG_AUDIT_DOWNTIME_END:05:00}
  owner-alerts:
    enabled: ${GRUN_OWNER_ALERTS_ENABLED:false}
    scan-interval-ms: ${GRUN_OWNER_ALERTS_SCAN_INTERVAL_MS:60000}
  product-ocr:
    cloud-enabled: ${GRUN_PRODUCT_OCR_CLOUD_ENABLED:false}
    gemini-model: ${GRUN_PRODUCT_OCR_GEMINI_MODEL:gemini-2.5-flash}
    fallback-threshold: ${GRUN_PRODUCT_OCR_FALLBACK_THRESHOLD:0.92}
    media-resolution: ${GRUN_PRODUCT_OCR_MEDIA_RESOLUTION:HIGH}
    max-attempts: ${GRUN_PRODUCT_OCR_MAX_ATTEMPTS:1}
    targeted-second-pass-enabled: ${GRUN_PRODUCT_OCR_TARGETED_SECOND_PASS_ENABLED:false}
    rollout-stage: ${GRUN_PRODUCT_OCR_ROLLOUT_STAGE:OFF}
    rollout-percentage: ${GRUN_PRODUCT_OCR_ROLLOUT_PERCENTAGE:0}
    internal-user-ids: ${GRUN_PRODUCT_OCR_INTERNAL_USER_IDS:}
    cache-ttl: ${GRUN_PRODUCT_OCR_CACHE_TTL:15m}
    cache-max-entries: ${GRUN_PRODUCT_OCR_CACHE_MAX_ENTRIES:5000}
    estimated-request-cost-usd: ${GRUN_PRODUCT_OCR_ESTIMATED_REQUEST_COST_USD:0}
  test-feedback:
    enabled: ${GRUN_TEST_FEEDBACK_ENABLED:false}
    allowed-environments: ${GRUN_TEST_FEEDBACK_ALLOWED_ENVIRONMENTS:preview,test,internal}
    screenshot-upload-url-ttl: ${GRUN_TEST_FEEDBACK_SCREENSHOT_UPLOAD_URL_TTL:10m}
    screenshot-admin-read-url-ttl: ${GRUN_TEST_FEEDBACK_SCREENSHOT_ADMIN_READ_URL_TTL:5m}
    screenshot-pending-ttl: ${GRUN_TEST_FEEDBACK_SCREENSHOT_PENDING_TTL:1h}
    screenshot-retention-days: ${GRUN_TEST_FEEDBACK_SCREENSHOT_RETENTION_DAYS:28}
    screenshot-max-upload-bytes: ${GRUN_TEST_FEEDBACK_SCREENSHOT_MAX_UPLOAD_BYTES:20971520}
    screenshot-cleanup-interval: ${GRUN_TEST_FEEDBACK_SCREENSHOT_CLEANUP_INTERVAL:1h}
  product-intake:
    rollout:
      enabled: ${GRUN_PRODUCT_INTAKE_ROLLOUT_ENABLED:false}
      kill-switch: ${GRUN_PRODUCT_INTAKE_KILL_SWITCH:false}
      percentage: ${GRUN_PRODUCT_INTAKE_ROLLOUT_PERCENTAGE:0}
      markets: ${GRUN_PRODUCT_INTAKE_ROLLOUT_MARKETS:}
      internal-dogfood-emails: ${GRUN_PRODUCT_INTAKE_DOGFOOD_EMAILS:}
      cohort-salt: ${GRUN_PRODUCT_INTAKE_COHORT_SALT:product-intake-v1}
  food-contribution-storage:
    provider: ${GRUN_FOOD_CONTRIBUTION_STORAGE_PROVIDER:LOCAL}
    max-upload-bytes: ${GRUN_FOOD_CONTRIBUTION_MAX_UPLOAD_BYTES:6291456}
    max-decoded-pixels: ${GRUN_FOOD_CONTRIBUTION_MAX_DECODED_PIXELS:24000000}
    allowed-content-types: ${GRUN_FOOD_CONTRIBUTION_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
    storage-directory: ${GRUN_FOOD_CONTRIBUTION_STORAGE_DIRECTORY:storage/food-contribution-evidence}
    private-base-url: ${GRUN_FOOD_CONTRIBUTION_PRIVATE_BASE_URL:http://localhost:8080}
    upload-session-ttl: ${GRUN_FOOD_CONTRIBUTION_UPLOAD_SESSION_TTL:20m}
    upload-url-ttl: ${GRUN_FOOD_CONTRIBUTION_UPLOAD_URL_TTL:10m}
    admin-read-url-ttl: ${GRUN_FOOD_CONTRIBUTION_ADMIN_READ_URL_TTL:5m}
    pending-retention-days: ${GRUN_FOOD_CONTRIBUTION_PENDING_RETENTION_DAYS:28}
    approved-evidence-deletion-delay: ${GRUN_FOOD_CONTRIBUTION_APPROVED_DELETION_DELAY:24h}
    rejected-evidence-retention: ${GRUN_FOOD_CONTRIBUTION_REJECTED_RETENTION:7d}
    cleanup-batch-size: ${GRUN_FOOD_CONTRIBUTION_CLEANUP_BATCH_SIZE:50}
    cleanup-interval: ${GRUN_FOOD_CONTRIBUTION_CLEANUP_INTERVAL:1h}
    s3:
      endpoint: ${GRUN_FOOD_CONTRIBUTION_S3_ENDPOINT:}
      jurisdiction: ${GRUN_FOOD_CONTRIBUTION_S3_JURISDICTION:eu-west-1}
      access-key: ${GRUN_FOOD_CONTRIBUTION_S3_ACCESS_KEY:}
      secret-key: ${GRUN_FOOD_CONTRIBUTION_S3_SECRET_KEY:}
      bucket: ${GRUN_FOOD_CONTRIBUTION_S3_BUCKET:}
      region: ${GRUN_FOOD_CONTRIBUTION_S3_REGION:eu-west-1}
      prefix: ${GRUN_FOOD_CONTRIBUTION_S3_PREFIX:pending/product-intakes}
      path-style-access: ${GRUN_FOOD_CONTRIBUTION_S3_PATH_STYLE_ACCESS:false}
  media-storage:
    provider: ${GRUN_MEDIA_STORAGE_PROVIDER:LOCAL}
    local-directory: ${GRUN_MEDIA_STORAGE_LOCAL_DIRECTORY:storage/media}
    root-prefix: ${GRUN_MEDIA_STORAGE_ROOT_PREFIX:grun}
    public-base-url: ${GRUN_MEDIA_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    s3:
      endpoint: ${GRUN_MEDIA_STORAGE_S3_ENDPOINT:}
      access-key: ${GRUN_MEDIA_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${GRUN_MEDIA_STORAGE_S3_SECRET_KEY:}
      bucket: ${GRUN_MEDIA_STORAGE_S3_BUCKET:}
      region: ${GRUN_MEDIA_STORAGE_S3_REGION:eu-west-1}
      path-style-access: ${GRUN_MEDIA_STORAGE_S3_PATH_STYLE_ACCESS:false}
  analytics:
    time-zone: ${GRUN_ANALYTICS_TIME_ZONE:Europe/Dublin}
    activity-throttle-minutes: ${GRUN_ANALYTICS_ACTIVITY_THROTTLE_MINUTES:15}
    activity-retention-days: ${GRUN_ANALYTICS_ACTIVITY_RETENTION_DAYS:400}
    activity-cleanup-cron: ${GRUN_ANALYTICS_ACTIVITY_CLEANUP_CRON:0 30 3 * * *}
  errors:
    include-internal-details: ${GRUN_ERRORS_INCLUDE_INTERNAL_DETAILS:false}
  recipe-media:
    image:
      max-upload-bytes: ${GRUN_RECIPE_IMAGE_MAX_UPLOAD_BYTES:4194304}
      max-decoded-pixels: ${GRUN_RECIPE_IMAGE_MAX_DECODED_PIXELS:48000000}
      allowed-content-types: ${GRUN_RECIPE_IMAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
      storage-directory: ${GRUN_RECIPE_IMAGE_STORAGE_DIRECTORY:storage/recipe-images}
      public-base-url: ${GRUN_RECIPE_IMAGE_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    admin-session:
      idle-timeout: ${GRUN_ADMIN_SESSION_IDLE_TIMEOUT:15m}
      absolute-timeout: ${GRUN_ADMIN_SESSION_ABSOLUTE_TIMEOUT:8h}
      secure-cookie: ${GRUN_ADMIN_SESSION_SECURE_COOKIE:false}
    owner-bootstrap:
      enabled: ${GRUN_OWNER_BOOTSTRAP_ENABLED:false}
      primary-email: ${GRUN_OWNER_PRIMARY_EMAIL:}
      primary-password: ${GRUN_OWNER_PRIMARY_PASSWORD:}
      recovery-password: ${GRUN_OWNER_RECOVERY_PASSWORD:}
    subscription-feature-filter-enabled: ${GRUN_SUBSCRIPTION_FEATURE_FILTER_ENABLED:true}
    swagger-public: ${GRUN_SWAGGER_PUBLIC:true}
  http-client:
    connect-timeout: ${GRUN_HTTP_CLIENT_CONNECT_TIMEOUT:3s}
    read-timeout: ${GRUN_HTTP_CLIENT_READ_TIMEOUT:10s}
  ai:
    enabled: ${GRUN_AI_ENABLED:false}
    provider: ${GRUN_AI_PROVIDER:DISABLED}
    model: ${GRUN_AI_MODEL:not-configured}
    prompt-version: ${GRUN_AI_PROMPT_VERSION:ai-prompt-v2}
    max-history-limit: ${GRUN_AI_MAX_HISTORY_LIMIT:30}
    completion-notifications:
      enabled: ${GRUN_AI_COMPLETION_NOTIFICATIONS_ENABLED:true}
      scan-interval-ms: ${GRUN_AI_COMPLETION_NOTIFICATIONS_SCAN_INTERVAL_MS:15000}
    photo:
      model: ${GRUN_AI_PHOTO_MODEL:}
      max-image-reference-length: ${GRUN_AI_PHOTO_MAX_IMAGE_REFERENCE_LENGTH:2048}
      allowed-reference-prefixes: ${GRUN_AI_PHOTO_ALLOWED_REFERENCE_PREFIXES:s3://grun-meals/}
      max-upload-bytes: ${GRUN_AI_PHOTO_MAX_UPLOAD_BYTES:5242880}
      allowed-content-types: ${GRUN_AI_PHOTO_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
      reference-ttl: ${GRUN_AI_PHOTO_REFERENCE_TTL:30m}
      cleanup-interval-ms: ${GRUN_AI_PHOTO_CLEANUP_INTERVAL_MS:3600000}
      storage-directory: ${GRUN_AI_PHOTO_STORAGE_DIRECTORY:storage/ai-meal-photos}
      public-base-url: ${GRUN_AI_PHOTO_PUBLIC_BASE_URL:https://api.grun.app}
      alternative-snapshots-enabled: ${GRUN_AI_PHOTO_ALTERNATIVE_SNAPSHOTS_ENABLED:false}
      max-alternative-snapshots: ${GRUN_AI_PHOTO_MAX_ALTERNATIVE_SNAPSHOTS:2}
    monitoring:
      min-requests-for-alert: ${GRUN_AI_MONITORING_MIN_REQUESTS_FOR_ALERT:5}
      failure-rate-threshold: ${GRUN_AI_MONITORING_FAILURE_RATE_THRESHOLD:0.20}
      rejection-rate-threshold: ${GRUN_AI_MONITORING_REJECTION_RATE_THRESHOLD:0.40}
      max-tokens-per-window: ${GRUN_AI_MONITORING_MAX_TOKENS_PER_WINDOW:1000000}
      max-estimated-cost-per-currency: ${GRUN_AI_MONITORING_MAX_ESTIMATED_COST_PER_CURRENCY:20.0}
    http-json:
      endpoint: ${GRUN_AI_HTTP_JSON_ENDPOINT:}
      api-key: ${GRUN_AI_HTTP_JSON_API_KEY:}
      timeout: ${GRUN_AI_HTTP_JSON_TIMEOUT:30s}
    openai:
      api-key: ${GRUN_AI_OPENAI_API_KEY:}
      base-url: ${GRUN_AI_OPENAI_BASE_URL:https://api.openai.com/v1/responses}
      connect-timeout: ${GRUN_AI_OPENAI_CONNECT_TIMEOUT:10s}
      timeout: ${GRUN_AI_OPENAI_TIMEOUT:120s}
      max-output-tokens: ${GRUN_AI_OPENAI_MAX_OUTPUT_TOKENS:12000}
      repair-enabled: ${GRUN_AI_OPENAI_REPAIR_ENABLED:true}
      max-repair-attempts: ${GRUN_AI_OPENAI_MAX_REPAIR_ATTEMPTS:1}
      input-token-cost-per-1m: ${GRUN_AI_OPENAI_INPUT_TOKEN_COST_PER_1M:0}
      output-token-cost-per-1m: ${GRUN_AI_OPENAI_OUTPUT_TOKEN_COST_PER_1M:0}
      cost-currency: ${GRUN_AI_OPENAI_COST_CURRENCY:USD}
  mail:
    provider: ${GRUN_MAIL_PROVIDER:LOG}
    from-email: ${GRUN_MAIL_FROM_EMAIL:no-reply@grun.local}
    from-name: ${GRUN_MAIL_FROM_NAME:GRUN}
    brevo:
      api-key: ${GRUN_BREVO_API_KEY:}
      api-url: ${GRUN_BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
      templates:
        email-verification-en: ${GRUN_BREVO_TEMPLATE_EMAIL_VERIFICATION_EN:0}
        email-verification-tr: ${GRUN_BREVO_TEMPLATE_EMAIL_VERIFICATION_TR:0}
        password-reset-en: ${GRUN_BREVO_TEMPLATE_PASSWORD_RESET_EN:0}
        password-reset-tr: ${GRUN_BREVO_TEMPLATE_PASSWORD_RESET_TR:0}
        subscription-feature-change-en: ${GRUN_BREVO_TEMPLATE_SUBSCRIPTION_FEATURE_CHANGE_EN:0}
        subscription-feature-change-tr: ${GRUN_BREVO_TEMPLATE_SUBSCRIPTION_FEATURE_CHANGE_TR:0}
        admin-invitation-en: ${GRUN_BREVO_TEMPLATE_ADMIN_INVITATION_EN:0}
        admin-invitation-tr: ${GRUN_BREVO_TEMPLATE_ADMIN_INVITATION_TR:0}
        admin-password-changed-en: ${GRUN_BREVO_TEMPLATE_ADMIN_PASSWORD_CHANGED_EN:0}
        admin-password-changed-tr: ${GRUN_BREVO_TEMPLATE_ADMIN_PASSWORD_CHANGED_TR:0}
  notifications:
    campaign-dispatch-enabled: ${GRUN_NOTIFICATION_CAMPAIGN_DISPATCH_ENABLED:true}
    campaign-dispatch-interval-ms: ${GRUN_NOTIFICATION_CAMPAIGN_DISPATCH_INTERVAL_MS:30000}
    producer-migration:
      water-enabled: ${GRUN_NOTIFICATION_MIGRATE_WATER:false}
      step-enabled: ${GRUN_NOTIFICATION_MIGRATE_STEP:false}
      basic-fasting-enabled: ${GRUN_NOTIFICATION_MIGRATE_BASIC_FASTING:false}
    delivery:
      enabled: ${GRUN_NOTIFICATION_DELIVERY_ENABLED:false}
      stage: ${GRUN_NOTIFICATION_RELEASE_STAGE:OFF}
      test-user-ids: ${GRUN_NOTIFICATION_TEST_USER_IDS:}
      pilot-user-ids: ${GRUN_NOTIFICATION_PILOT_USER_IDS:}
      live-percentage: ${GRUN_NOTIFICATION_LIVE_PERCENTAGE:0}
      scan-ms: ${GRUN_NOTIFICATION_DELIVERY_SCAN_MS:5000}
      outbox-batch-size: ${GRUN_NOTIFICATION_DELIVERY_OUTBOX_BATCH_SIZE:100}
      lease: ${GRUN_NOTIFICATION_DELIVERY_LEASE:2m}
      base-retry-delay: ${GRUN_NOTIFICATION_DELIVERY_BASE_RETRY_DELAY:2m}
      default-ttl: ${GRUN_NOTIFICATION_DELIVERY_DEFAULT_TTL:24h}
      max-attempts: ${GRUN_NOTIFICATION_DELIVERY_MAX_ATTEMPTS:3}
  revenuecat:
    # Set this to the exact Authorization header configured in RevenueCat dashboard.
    webhook-authorization: ${GRUN_REVENUECAT_WEBHOOK_AUTHORIZATION:}
    strict-product-mapping: ${GRUN_REVENUECAT_STRICT_PRODUCT_MAPPING:true}
    api:
      enabled: ${GRUN_REVENUECAT_API_ENABLED:false}
      base-url: ${GRUN_REVENUECAT_API_BASE_URL:https://api.revenuecat.com/v2}
      secret-key: ${GRUN_REVENUECAT_API_SECRET_KEY:}
      project-id: ${GRUN_REVENUECAT_PROJECT_ID:}
      currency: ${GRUN_REVENUECAT_CURRENCY:EUR}
    entitlements:
      plus: ${GRUN_REVENUECAT_PLUS_ENTITLEMENTS:plus,plus_access}
      pro: ${GRUN_REVENUECAT_PRO_ENTITLEMENTS:pro,pro_access}
    products:
      plus: ${GRUN_REVENUECAT_PLUS_PRODUCT_IDS:}
      pro: ${GRUN_REVENUECAT_PRO_PRODUCT_IDS:}
      default-ai-addon-validity-days: ${GRUN_REVENUECAT_AI_ADDON_DEFAULT_VALIDITY_DAYS:30}
      ai-addon-quotas:
        grun_ai_15_credits: 15
        grun_ai_50_credits: 50
      ai-addon-validity-days:
        grun_ai_15_credits: 30
        grun_ai_50_credits: 30
  push:
    enabled: ${GRUN_PUSH_ENABLED:false}
    provider: ${GRUN_PUSH_PROVIDER:LOG}
    expo:
      url: ${GRUN_PUSH_EXPO_URL:https://exp.host/--/api/v2/push/send}
      access-token: ${GRUN_PUSH_EXPO_ACCESS_TOKEN:}
    fcm:
      project-id: ${GRUN_PUSH_FCM_PROJECT_ID:}
      access-token: ${GRUN_PUSH_FCM_ACCESS_TOKEN:}
      credentials-json: ${GRUN_PUSH_FCM_CREDENTIALS_JSON:}
    onesignal:
      app-id: ${GRUN_PUSH_ONESIGNAL_APP_ID:}
      api-key: ${GRUN_PUSH_ONESIGNAL_API_KEY:}
  oauth:
    google:
      # Comma-separated Google client ids that are allowed to call the backend.
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
    apple:
      # Comma-separated Apple App ID or Services ID audiences accepted by the backend.
      client-ids: ${APPLE_OAUTH_CLIENT_IDS:}
  email-verification:
    base-url: ${GRUN_EMAIL_VERIFICATION_BASE_URL:http://localhost:8082/verify-email}
    resend-cooldown-level-1-seconds: ${GRUN_EMAIL_VERIFICATION_RESEND_COOLDOWN_LEVEL_1_SECONDS:30}
    resend-cooldown-level-2-seconds: ${GRUN_EMAIL_VERIFICATION_RESEND_COOLDOWN_LEVEL_2_SECONDS:120}
    resend-cooldown-level-3-seconds: ${GRUN_EMAIL_VERIFICATION_RESEND_COOLDOWN_LEVEL_3_SECONDS:300}
  password-reset:
    expiration-minutes: ${GRUN_PASSWORD_RESET_EXPIRATION_MINUTES:30}
    base-url: ${GRUN_PASSWORD_RESET_BASE_URL:http://localhost:8082/reset-password}
    request-cooldown-seconds: ${GRUN_PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}
  tokens:
    cleanup-interval-ms: ${GRUN_TOKENS_CLEANUP_INTERVAL_MS:3600000}
  rate-limit:
    enabled: ${GRUN_RATE_LIMIT_ENABLED:true}
    admin-auth:
      ip:
        max-requests-per-minute: ${GRUN_RATE_LIMIT_ADMIN_AUTH_IP_MAX_REQUESTS_PER_MINUTE:20}
      account:
        max-requests-per-minute: ${GRUN_RATE_LIMIT_ADMIN_AUTH_ACCOUNT_MAX_REQUESTS_PER_MINUTE:5}
        max-requests-per-fifteen-minutes: ${GRUN_RATE_LIMIT_ADMIN_AUTH_ACCOUNT_MAX_REQUESTS_PER_FIFTEEN_MINUTES:20}
    trusted-proxy-count: ${GRUN_RATE_LIMIT_TRUSTED_PROXY_COUNT:0}
    redis:
      enabled: ${GRUN_RATE_LIMIT_REDIS_ENABLED:false}
    password-reset:
      max-requests-per-minute: ${GRUN_RATE_LIMIT_PASSWORD_RESET_MAX_REQUESTS_PER_MINUTE:5}
    email-verification-resend:
      max-requests-per-minute: ${GRUN_RATE_LIMIT_EMAIL_VERIFICATION_RESEND_MAX_REQUESTS_PER_MINUTE:5}
    ai-draft:
      max-requests-per-minute: ${GRUN_RATE_LIMIT_AI_DRAFT_MAX_REQUESTS_PER_MINUTE:10}
      account-max-requests-per-minute: ${GRUN_RATE_LIMIT_AI_ACCOUNT_MAX_REQUESTS_PER_MINUTE:10}
  water:
    default-daily-target-ml: ${GRUN_WATER_DEFAULT_DAILY_TARGET_ML:2500}
    reminders:
      enabled: ${GRUN_WATER_REMINDER_ENABLED:true}
      scan-interval-ms: ${GRUN_WATER_REMINDER_SCAN_INTERVAL_MS:300000}
