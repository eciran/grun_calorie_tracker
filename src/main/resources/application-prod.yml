spring:
  datasource:
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:0}
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
    cache-names: foodProductById,foodProductByBarcode,foodProductSearch,dashboardDailySummary,progressBasicAnalytics,progressAdvancedAnalytics,energyBalanceAnalytics,micronutrientAnalytics,waterDailySummary,waterRangeSummary,stepDailySummary,stepRangeSummary,stepManualLogs,fastingDailySummary,fastingRangeSummary,fastingSessionHistory,sleepDailySummary,sleepWeeklySummary,sleepSessionHistory,healthDailySummary,healthRangeSummary
    redis:
      time-to-live: ${SPRING_CACHE_REDIS_TIME_TO_LIVE:10m}
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "grun:${GRUN_ENVIRONMENT:prod}:"
  data:
    redis:
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:1s}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 25
  flyway:
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:6MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:7MB}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.grun.calorietracker: INFO

grun:
  errors:
    include-internal-details: false
  food-contribution-storage:
    provider: ${GRUN_FOOD_CONTRIBUTION_STORAGE_PROVIDER:S3}
    max-upload-bytes: ${GRUN_FOOD_CONTRIBUTION_MAX_UPLOAD_BYTES:6291456}
    allowed-content-types: ${GRUN_FOOD_CONTRIBUTION_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
    storage-directory: ${GRUN_FOOD_CONTRIBUTION_STORAGE_DIRECTORY:storage/food-contribution-evidence}
    private-base-url: ${GRUN_FOOD_CONTRIBUTION_PRIVATE_BASE_URL:https://api.grun.app}
    s3:
      bucket: ${GRUN_FOOD_CONTRIBUTION_S3_BUCKET:}
      region: ${GRUN_FOOD_CONTRIBUTION_S3_REGION:eu-west-1}
      prefix: ${GRUN_FOOD_CONTRIBUTION_S3_PREFIX:product-contributions}
  recipe-media:
    image:
      max-upload-bytes: ${GRUN_RECIPE_IMAGE_MAX_UPLOAD_BYTES:4194304}
      allowed-content-types: ${GRUN_RECIPE_IMAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
      storage-directory: ${GRUN_RECIPE_IMAGE_STORAGE_DIRECTORY:storage/recipe-images}
      public-base-url: ${GRUN_RECIPE_IMAGE_PUBLIC_BASE_URL:https://api.grun.app}
  profile-media:
    avatar:
      max-upload-bytes: ${GRUN_PROFILE_AVATAR_MAX_UPLOAD_BYTES:2097152}
      allowed-content-types: ${GRUN_PROFILE_AVATAR_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
      storage-directory: ${GRUN_PROFILE_AVATAR_STORAGE_DIRECTORY:storage/profile-avatars}
      public-base-url: ${GRUN_PROFILE_AVATAR_PUBLIC_BASE_URL:https://api.grun.app}
  security:
    admin-mfa-required: ${GRUN_SECURITY_ADMIN_MFA_REQUIRED:false}
    swagger-public: false
    login:
      max-failed-attempts: ${GRUN_SECURITY_LOGIN_MAX_FAILED_ATTEMPTS:5}
      lock-minutes: ${GRUN_SECURITY_LOGIN_LOCK_MINUTES:15}
  http-client:
    connect-timeout: ${GRUN_HTTP_CLIENT_CONNECT_TIMEOUT:3s}
    read-timeout: ${GRUN_HTTP_CLIENT_READ_TIMEOUT:10s}
  ai:
    enabled: ${GRUN_AI_ENABLED:false}
    provider: ${GRUN_AI_PROVIDER:DISABLED}
    model: ${GRUN_AI_MODEL:not-configured}
    max-history-limit: ${GRUN_AI_MAX_HISTORY_LIMIT:30}
    monitoring:
      min-requests-for-alert: ${GRUN_AI_MONITORING_MIN_REQUESTS_FOR_ALERT:5}
      failure-rate-threshold: ${GRUN_AI_MONITORING_FAILURE_RATE_THRESHOLD:0.20}
      rejection-rate-threshold: ${GRUN_AI_MONITORING_REJECTION_RATE_THRESHOLD:0.40}
      max-tokens-per-window: ${GRUN_AI_MONITORING_MAX_TOKENS_PER_WINDOW:1000000}
      max-estimated-cost-per-currency: ${GRUN_AI_MONITORING_MAX_ESTIMATED_COST_PER_CURRENCY:20.0}
    safety:
      enabled: ${GRUN_AI_SAFETY_ENABLED:true}
      max-item-calories: ${GRUN_AI_SAFETY_MAX_ITEM_CALORIES:3000}
      max-total-calories: ${GRUN_AI_SAFETY_MAX_TOTAL_CALORIES:6000}
    photo:
      max-image-reference-length: ${GRUN_AI_PHOTO_MAX_IMAGE_REFERENCE_LENGTH:2048}
      allowed-reference-prefixes: ${GRUN_AI_PHOTO_ALLOWED_REFERENCE_PREFIXES:s3://,https://}
      max-upload-bytes: ${GRUN_AI_PHOTO_MAX_UPLOAD_BYTES:5242880}
      allowed-content-types: ${GRUN_AI_PHOTO_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
      reference-ttl: ${GRUN_AI_PHOTO_REFERENCE_TTL:30m}
      cleanup-interval-ms: ${GRUN_AI_PHOTO_CLEANUP_INTERVAL_MS:3600000}
      storage-directory: ${GRUN_AI_PHOTO_STORAGE_DIRECTORY:storage/ai-meal-photos}
      public-base-url: ${GRUN_AI_PHOTO_PUBLIC_BASE_URL:https://api.grun.app}
      alternative-snapshots-enabled: ${GRUN_AI_PHOTO_ALTERNATIVE_SNAPSHOTS_ENABLED:false}
      max-alternative-snapshots: ${GRUN_AI_PHOTO_MAX_ALTERNATIVE_SNAPSHOTS:2}
    http-json:
      endpoint: ${GRUN_AI_HTTP_JSON_ENDPOINT:}
      api-key: ${GRUN_AI_HTTP_JSON_API_KEY:}
      timeout: ${GRUN_AI_HTTP_JSON_TIMEOUT:30s}
    openai:
      api-key: ${GRUN_AI_OPENAI_API_KEY:}
      base-url: ${GRUN_AI_OPENAI_BASE_URL:https://api.openai.com/v1/responses}
      connect-timeout: ${GRUN_AI_OPENAI_CONNECT_TIMEOUT:10s}
      timeout: ${GRUN_AI_OPENAI_TIMEOUT:120s}
      max-output-tokens: ${GRUN_AI_OPENAI_MAX_OUTPUT_TOKENS:12000}
      input-token-cost-per-1m: ${GRUN_AI_OPENAI_INPUT_TOKEN_COST_PER_1M:0}
      output-token-cost-per-1m: ${GRUN_AI_OPENAI_OUTPUT_TOKEN_COST_PER_1M:0}
      cost-currency: ${GRUN_AI_OPENAI_COST_CURRENCY:USD}
    recipe-image-moderation:
      enabled: ${GRUN_AI_RECIPE_IMAGE_MODERATION_ENABLED:false}
      endpoint: ${GRUN_AI_RECIPE_IMAGE_MODERATION_ENDPOINT:}
      api-key: ${GRUN_AI_RECIPE_IMAGE_MODERATION_API_KEY:}
      timeout: ${GRUN_AI_RECIPE_IMAGE_MODERATION_TIMEOUT:15s}
      reject-threshold: ${GRUN_AI_RECIPE_IMAGE_MODERATION_REJECT_THRESHOLD:0.85}
      approve-threshold: ${GRUN_AI_RECIPE_IMAGE_MODERATION_APPROVE_THRESHOLD:0.95}
  product-search:
    telemetry-cleanup-cron: ${GRUN_PRODUCT_SEARCH_TELEMETRY_CLEANUP_CRON:0 20 3 * * *}
  product-catalog:
    maintenance:
      stale-days: ${GRUN_PRODUCT_CATALOG_STALE_DAYS:180}
      batch-size: ${GRUN_PRODUCT_CATALOG_MAINTENANCE_BATCH_SIZE:500}
      scheduled-quality-enabled: ${GRUN_PRODUCT_CATALOG_SCHEDULED_QUALITY_ENABLED:true}
      stale-scan-cron: ${GRUN_PRODUCT_CATALOG_STALE_SCAN_CRON:0 10 2 * * *}
      quality-scan-cron: ${GRUN_PRODUCT_CATALOG_QUALITY_SCAN_CRON:0 40 2 * * *}
  mail:
    provider: ${GRUN_MAIL_PROVIDER:BREVO}
  tokens:
    cleanup-interval-ms: ${GRUN_TOKENS_CLEANUP_INTERVAL_MS:3600000}
  rate-limit:
    enabled: true
    trusted-proxy-count: ${GRUN_RATE_LIMIT_TRUSTED_PROXY_COUNT:0}
    redis:
      enabled: true
    account-link:
      max-requests-per-minute: ${GRUN_RATE_LIMIT_ACCOUNT_LINK_MAX_REQUESTS_PER_MINUTE:5}
  revenuecat:
    strict-product-mapping: true
    api:
      enabled: ${GRUN_REVENUECAT_API_ENABLED:false}
      base-url: ${GRUN_REVENUECAT_API_BASE_URL:https://api.revenuecat.com/v2}
      secret-key: ${GRUN_REVENUECAT_API_SECRET_KEY:}
      project-id: ${GRUN_REVENUECAT_PROJECT_ID:}
      currency: ${GRUN_REVENUECAT_CURRENCY:EUR}
  local:
    admin:
      bootstrap-enabled: false
    demo-seed:
      enabled: false

