<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>GRUN</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211527;background:#f7f6f8}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}main{width:min(100%,460px);padding:32px;border:1px solid #e2dce6;border-radius:18px;background:#fff;box-shadow:0 16px 45px rgba(55,29,67,.1);text-align:center}.mark{width:64px;height:64px;margin:0 auto 20px;display:grid;place-items:center;border-radius:18px;background:#f0e4f8;color:#6812a3;font-size:30px;font-weight:700}h1{margin:0 0 12px;font-size:24px}p{margin:0 0 22px;color:#655b69;line-height:1.55}.actions{display:grid;gap:12px}button,a.button{width:100%;min-height:50px;padding:13px 20px;border:1px solid #6812a3;border-radius:999px;background:#6812a3;color:#fff;text-decoration:none;font:600 16px inherit;cursor:pointer}button:disabled{opacity:.55;cursor:default}form{display:grid;gap:13px;text-align:left}label{display:grid;gap:6px;color:#4a404f;font-size:14px}input{width:100%;min-height:48px;padding:11px 13px;border:1px solid #cfc5d4;border-radius:12px;background:#fff;color:#211527;font:16px inherit}.hint{margin:0;color:#766c7a;font-size:13px}.status{margin:18px 0 0;padding:13px;border-radius:12px;background:#f5eff8;color:#4f2468}.status.error{background:#fff0f0;color:#a92222}.hidden{display:none!important}@media(prefers-color-scheme:dark){:root,body{background:#17131a;color:#f8f4fa}main{background:#211b24;border-color:#3d3342}p,.hint{color:#c8bdcc}label{color:#e5dce8}input{background:#17131a;border-color:#5c4d63;color:#fff}}
  </style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">G</div><h1 id="title">Continue in GRUN</h1><p id="message">Open the GRUN app to continue.</p>
  <div id="verify-actions" class="actions hidden"><a id="open-app" class="button" href="#">Open GRUN</a><button id="verify-browser" type="button">Verify in this browser</button></div>
  <div id="reset-actions" class="hidden"><div class="actions"><a id="open-reset-app" class="button" href="#">Open GRUN</a></div><p id="or-label" class="hint" style="margin:18px 0">or reset securely in this browser</p><form id="reset-form"><label><span id="password-label">New password</span><input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label><span id="confirm-label">Confirm password</span><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required></label><p id="password-hint" class="hint">Use at least 8 characters with uppercase, lowercase, a number and a special character.</p><button id="reset-submit" type="submit">Update password</button></form></div>
  <div id="app-only-actions" class="actions hidden"><a id="open-only-app" class="button" href="#">Open GRUN</a></div><p id="status" class="status hidden" role="status" aria-live="polite"></p>
</main>
<script>
(function(){'use strict';
var path=window.location.pathname,allowed={'/verify-email':'verify-email','/reset-password':'reset-password','/open/plans':'pro-upgrade','/open/notifications':'notifications','/open/profile':'profile'},target=allowed[path],query=new URLSearchParams(window.location.search),token=query.get('token')||'',isTr=(query.get('lang')||'').toLowerCase()==='tr';document.documentElement.lang=isTr?'tr':'en';if(!target){window.location.replace('/');return;}
var safeQuery=new URLSearchParams();if((target==='verify-email'||target==='reset-password')&&token)safeQuery.set('token',token);if(isTr)safeQuery.set('lang','tr');var appUrl='grun://'+target+(safeQuery.toString()?'?'+safeQuery.toString():'');if(window.history&&window.history.replaceState)window.history.replaceState({},document.title,path+(isTr?'?lang=tr':''));
var copy=isTr?{verifyTitle:'E-posta adresini doğrula',verifyMessage:'GRUN uygulamasında devam et veya e-posta adresini bu tarayıcıda doğrula.',open:'GRUN’da aç',verify:'Bu tarayıcıda doğrula',verifying:'E-posta adresin doğrulanıyor…',verified:'E-posta adresin doğrulandı. Artık GRUN uygulamasına dönebilirsin.',resetTitle:'Şifreni sıfırla',resetMessage:'GRUN uygulamasında devam et veya şifreni bu tarayıcıda güvenli şekilde değiştir.',or:'veya bu tarayıcıda güvenli şekilde sıfırla',password:'Yeni şifre',confirm:'Yeni şifreyi doğrula',hint:'En az 8 karakter; büyük harf, küçük harf, rakam ve özel karakter kullan.',update:'Şifreyi güncelle',updating:'Şifre güncelleniyor…',updated:'Şifren güncellendi. Artık GRUN’da giriş yapabilirsin.',mismatch:'Şifreler eşleşmiyor.',policy:'Şifre güvenlik koşullarını karşılamıyor.',invalid:'Bu bağlantı geçersiz, kullanılmış veya süresi dolmuş. Uygulamadan yeni bir bağlantı iste.',appTitle:'GRUN’da devam et',appMessage:'Bu bağlantı GRUN uygulamasındaki ilgili ekranı açar.'}:{verifyTitle:'Verify your email',verifyMessage:'Continue in the GRUN app or verify your email in this browser.',open:'Open GRUN',verify:'Verify in this browser',verifying:'Verifying your email…',verified:'Your email is verified. You can now return to the GRUN app.',resetTitle:'Reset your password',resetMessage:'Continue in the GRUN app or securely change your password in this browser.',or:'or reset securely in this browser',password:'New password',confirm:'Confirm new password',hint:'Use at least 8 characters with uppercase, lowercase, a number and a special character.',update:'Update password',updating:'Updating password…',updated:'Your password has been updated. You can now sign in to GRUN.',mismatch:'Passwords do not match.',policy:'The password does not meet the security requirements.',invalid:'This link is invalid, used, or expired. Request a new link from the app.',appTitle:'Continue in GRUN',appMessage:'This link opens the related screen in the GRUN app.'};
var title=document.getElementById('title'),message=document.getElementById('message'),status=document.getElementById('status');function showStatus(text,error){status.textContent=text;status.className='status'+(error?' error':'');}function setBusy(button,busy,label){button.disabled=busy;button.textContent=label;}async function post(url,body){var response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'omit',cache:'no-store',body:JSON.stringify(body)});if(!response.ok)throw new Error('request_failed');return response;}
if(target==='verify-email'){title.textContent=copy.verifyTitle;message.textContent=copy.verifyMessage;var verifyActions=document.getElementById('verify-actions'),open=document.getElementById('open-app'),verify=document.getElementById('verify-browser');verifyActions.classList.remove('hidden');open.href=appUrl;open.textContent=copy.open;verify.textContent=copy.verify;if(!token){verify.disabled=true;showStatus(copy.invalid,true);}verify.addEventListener('click',async function(){setBusy(verify,true,copy.verifying);try{await post('/api/v1/auth/email-verification/confirm',{token:token});verifyActions.classList.add('hidden');showStatus(copy.verified,false);}catch(e){setBusy(verify,false,copy.verify);showStatus(copy.invalid,true);}});return;}
if(target==='reset-password'){title.textContent=copy.resetTitle;message.textContent=copy.resetMessage;var resetActions=document.getElementById('reset-actions'),openReset=document.getElementById('open-reset-app'),form=document.getElementById('reset-form'),submit=document.getElementById('reset-submit');resetActions.classList.remove('hidden');openReset.href=appUrl;openReset.textContent=copy.open;document.getElementById('or-label').textContent=copy.or;document.getElementById('password-label').textContent=copy.password;document.getElementById('confirm-label').textContent=copy.confirm;document.getElementById('password-hint').textContent=copy.hint;submit.textContent=copy.update;if(!token){Array.from(form.elements).forEach(function(el){el.disabled=true;});showStatus(copy.invalid,true);return;}form.addEventListener('submit',async function(event){event.preventDefault();var password=document.getElementById('password').value,confirm=document.getElementById('confirm-password').value,pattern=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d\s])\S{8,}$/;if(password!==confirm){showStatus(copy.mismatch,true);return;}if(!pattern.test(password)){showStatus(copy.policy,true);return;}setBusy(submit,true,copy.updating);try{await post('/api/v1/auth/password-reset/confirm',{token:token,newPassword:password});form.classList.add('hidden');showStatus(copy.updated,false);}catch(e){setBusy(submit,false,copy.update);showStatus(copy.invalid,true);}});return;}
title.textContent=copy.appTitle;message.textContent=copy.appMessage;var appOnly=document.getElementById('app-only-actions'),openOnly=document.getElementById('open-only-app');appOnly.classList.remove('hidden');openOnly.href=appUrl;openOnly.textContent=copy.open;
}());
</script>
</body>
</html>
