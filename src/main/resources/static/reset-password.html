<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>GRUN</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff}
    body{display:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body.error{display:grid;place-items:center;padding:24px;box-sizing:border-box;color:#211527}
    p{max-width:420px;margin:0;text-align:center;line-height:1.5}
    @media(prefers-color-scheme:dark){html,body{background:#17131a}body.error{color:#f8f4fa}}
  </style>
  <script>
    (function(){
      var query=new URLSearchParams(window.location.search);
      var token=query.get('token');
      var isTr=(query.get('lang')||'').toLowerCase()==='tr';
      document.documentElement.lang=isTr?'tr':'en';

      if(token){
        window.location.replace('grun://reset-password?token='+encodeURIComponent(token));
        return;
      }

      document.addEventListener('DOMContentLoaded',function(){
        document.body.className='error';
        document.getElementById('error').textContent=isTr
          ?'Bu şifre sıfırlama bağlantısı eksik. Lütfen uygulamadan yeni bir e-posta iste.'
          :'This password reset link is incomplete. Please request a new email from the app.';
      });
    }());
  </script>
</head>
<body>
  <p id="error" role="alert"></p>
</body>
</html>
